<!DOCTYPE html>
<html>
<head>
<title>Join DropZone Tournament</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
}

input,button{
padding:12px;
margin:8px;
border-radius:8px;
width:80%;
}

button{
background:red;
color:white;
border:0;
}
</style>

</head>

<body>

<h1>🔥 Join DropZone Tournament</h1>

<div class="box">

<input id="name" placeholder="Player Name">

<input id="uid" placeholder="Free Fire UID">

<input id="phone" placeholder="Mobile Number">

<button onclick="join()">Submit</button>

<h3 id="msg"></h3>

</div>


<script>

function join(){

let name=document.getElementById("name").value;

document.getElementById("msg").innerHTML=
"✅ "+name+" Tournament ke liye register ho gaya!";

}

</script>

</body>
</html>
