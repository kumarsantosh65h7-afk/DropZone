<!DOCTYPE html>
<html>
<head>
<title>Join Tournament - DropZone</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
}

input{
width:90%;
padding:12px;
margin:8px;
border-radius:8px;
}

button{
background:red;
color:white;
padding:12px 25px;
border:0;
border-radius:10px;
}
</style>

</head>

<body>

<h1>🔥 Join DropZone Tournament</h1>

<div class="box">

<input id="name" placeholder="Player Name">

<input id="game" placeholder="Free Fire UID">

<button onclick="join()">Join Tournament</button>

<p id="msg"></p>

</div>

<script>

function join(){

let player={
name:document.getElementById("name").value,
uid:document.getElementById("game").value
};

let players=JSON.parse(localStorage.getItem("players")) || [];

players.push(player);

localStorage.setItem("players",JSON.stringify(players));

document.getElementById("msg").innerHTML="Joined Successfully 🔥";

}

</script>

</body>
</html>
