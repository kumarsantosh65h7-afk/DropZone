<!DOCTYPE html>
<html>
<head>
<title>Join DropZone Tournament</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
}

input,button{
padding:12px;
margin:8px;
border-radius:8px;
width:80%;
}

button{
background:red;
color:white;
border:0;
}
</style>

</head>

<body>

<h1>🔥 Join Tournament</h1>

<div class="box">

<input id="name" placeholder="Player Name">

<input id="uid" placeholder="Free Fire UID">

<input id="phone" placeholder="Mobile Number">

<button onclick="register()">Submit</button>

<h3 id="msg"></h3>

</div>


<script>

function register(){

let player = {
name: document.getElementById("name").value,
uid: document.getElementById("uid").value,
phone: document.getElementById("phone").value
};

let players = JSON.parse(localStorage.getItem("players")) || [];

players.push(player);

localStorage.setItem("players", JSON.stringify(players));

document.getElementById("msg").innerHTML =
"✅ Registration Complete";

}

</script>

</body>
</html>
