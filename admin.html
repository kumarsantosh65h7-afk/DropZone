<!DOCTYPE html>
<html>
<head>
<title>DropZone Admin</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
margin:15px;
}

button{
background:red;
color:white;
padding:12px;
border:0;
border-radius:8px;
}

.player{
background:#333;
padding:10px;
margin:10px;
border-radius:8px;
}
</style>

</head>

<body>

<h1>🔥 DropZone Admin</h1>

<div class="box">

<h2>Players List</h2>

<div id="players"></div>

</div>


<script>

let list = JSON.parse(localStorage.getItem("players")) || [];

let box = document.getElementById("players");

if(list.length==0){

box.innerHTML="No Players Registered";

}else{

list.forEach((p,index)=>{

box.innerHTML +=
`
<div class="player">
Player: ${p.name}<br>
UID: ${p.uid}<br>
Phone: ${p.phone}
</div>
`;

});

}

</script>

</body>
</html>
