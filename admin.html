<!DOCTYPE html>
<html>
<head>
<title>DropZone Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
}

.player{
background:#333;
margin:10px;
padding:10px;
border-radius:10px;
}
</style>

</head>

<body>

<h1>🔥 DropZone Admin</h1>

<div class="box">

<h2>Players List</h2>

<div id="players">
No Players Registered
</div>

</div>


<script>

let players = JSON.parse(localStorage.getItem("players")) || [];

let list = document.getElementById("players");

if(players.length > 0){

list.innerHTML="";

players.forEach((p,i)=>{

list.innerHTML += `
<div class="player">
${i+1}. ${p.name}<br>
UID: ${p.uid}
</div>
`;

});

}

</script>

</body>
</html>
