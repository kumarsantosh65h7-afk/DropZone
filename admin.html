<!DOCTYPE html>
<html>
<head>
<title>DropZone Admin</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

input,button{
padding:12px;
margin:8px;
border-radius:8px;
}

button{
background:red;
color:white;
border:0;
}
</style>

</head>

<body>

<h1>🔥 DropZone Admin</h1>

<input id="game" placeholder="Game Name">
<br>

<input id="entry" placeholder="Entry Fee">
<br>

<input id="kill" placeholder="Per Kill Reward">
<br>

<button onclick="saveTournament()">Save Tournament</button>

<h3 id="msg"></h3>


<script>

function saveTournament(){

let data={
game:document.getElementById("game").value,
entry:document.getElementById("entry").value,
kill:document.getElementById("kill").value
};

localStorage.setItem("tournament",JSON.stringify(data));

document.getElementById("msg").innerHTML="✅ Tournament Saved";

}

</script>

</body>
</html>
