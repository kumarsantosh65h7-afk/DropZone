<!DOCTYPE html>
<html>
<head>
<title>DropZone Admin</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

input,button{
padding:12px;
margin:8px;
border-radius:8px;
}

button{
background:red;
color:white;
border:0;
}
</style>

</head>

<body>

<h1>🔥 DropZone Admin</h1>

<input id="game" placeholder="Game Name">
<br>

<input id="entry" placeholder="Entry Fee">
<br>

<input id="kill" placeholder="Per Kill Reward">
<br>

<button onclick="saveTournament()">Save</button>

<h3 id="msg"></h3>

<div id="show"></div>


<script>

function saveTournament(){

let data={
game:game.value,
entry:entry.value,
kill:kill.value
};

localStorage.setItem("tournament",JSON.stringify(data));

showTournament();

msg.innerHTML="✅ Saved";

}


function showTournament(){

let data=JSON.parse(localStorage.getItem("tournament"));

if(data){

show.innerHTML=
"🎮 "+data.game+
"<br>💰 Entry: ₹"+data.entry+
"<br>🎯 Per Kill: ₹"+data.kill;

}

}

showTournament();

</script>

</body>
</html>
