<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropZone</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:#fff;
}

.header{
background:#d50000;
padding:18px;
text-align:center;
font-size:30px;
font-weight:bold;
}

.banner{
background:#181818;
padding:25px;
text-align:center;
}

.banner h2{
font-size:26px;
margin-bottom:8px;
}

.banner p{
color:#ccc;
}

.card{
background:#202020;
margin:20px;
padding:20px;
border-radius:15px;
box-shadow:0 0 12px rgba(255,0,0,.25);
}

.info{
padding:10px 0;
border-bottom:1px solid #333;
font-size:18px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#ff0000;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#c40000;
}

.footer{
text-align:center;
padding:20px;
color:#999;
}

</style>
</head>

<body>

<div class="header">
🔥 DropZone
</div>

<div class="banner">
<h2 id="title">Live Tournament</h2>
<p>Play • Win • Earn</p>
</div>

<div class="card">

<div class="info">💰 Entry Fee: <span id="entry">Loading...</span></div>

<div class="info">🔥 Per Kill: <span id="kill">Loading...</span></div>

<div class="info">🏆 Prize Pool: <span id="prize">Loading...</span></div>

<div class="info">👥 Slots: <span id="slots">Loading...</span></div>

<div class="info">🕒 Match Time: <span id="time">Loading...</span></div>

<button onclick="location.href='join.html'">
🎮 Join Tournament
</button>

<button onclick="location.href='login.html'">
🔐 Admin Login
</button>

<script src="script.js"></script></div>

<div class="footer">
© 2026 DropZone Tournament Platform
</div>

</body>
</html>
