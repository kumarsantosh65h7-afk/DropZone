<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropZone Admin Login</title>

<style>
body{
background:#111;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
background:#222;
padding:25px;
border-radius:12px;
width:300px;
text-align:center;
}
input{
width:90%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:none;
}
button{
background:red;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>🔥 Admin Login</h2>

<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>
</div>

<script>
function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="dropzone123"){
location.href="admin.html";
}else{
document.getElementById("msg").innerHTML="Wrong Username or Password";
}

}
</script>

</body>
</html>
